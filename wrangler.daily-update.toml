name = "xsmb-daily-update-dispatcher"
main = "workers/daily-update-dispatcher/src/index.js"
compatibility_date = "2026-06-03"
workers_dev = true

[triggers]
crons = [
  "40 11 * * *",
  "0 12 * * *",
  "20 12 * * *",
  "40 12 * * *",
  "0 13 * * *"
]

[vars]
GITHUB_OWNER = "chungtvvn"
GITHUB_REPO = "lottery-vercel"
