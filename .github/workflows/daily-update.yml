name: Daily Vina Lottery R2 Generator

on:
  schedule:
    # GitHub Actions schedule is best-effort, so keep several idempotent retry slots
    # after 18:40 GMT+7 (11:40 UTC) instead of relying on one exact minute.
    - cron: '40 11 * * *'
    - cron: '50 11 * * *'
    - cron: '0 12 * * *'
    - cron: '10 12 * * *'
    - cron: '20 12 * * *'
    - cron: '40 12 * * *'
  workflow_dispatch:
    inputs:
      wait_for_new_xoso:
        description: '1 = chờ dữ liệu ngày mới, 0 = chỉ test luồng bằng dữ liệu mới nhất đang có'
        required: true
        default: '0'
        type: choice
        options:
          - '1'
          - '0'
      xoso_max_wait_minutes:
        description: 'Số phút chờ tối đa khi wait_for_new_xoso=1'
        required: true
        default: '90'
        type: string
      xoso_retry_interval_seconds:
        description: 'Khoảng cách retry nguồn xoso.com.vn'
        required: true
        default: '60'
        type: string
      xoso_target_date:
        description: 'Ngày cần chờ dạng YYYY-MM-DD; để trống sẽ dùng ngày hiện tại GMT+7'
        required: false
        default: ''
        type: string
      force_regenerate_stats:
        description: '1 = xoá cache cũ và sinh lại toàn bộ thống kê từ raw data hiện tại'
        required: true
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
      clear_r2_statistics:
        description: '1 = xoá toàn bộ object cũ trong R2 statistics/ trước khi upload'
        required: true
        default: '0'
        type: choice
        options:
          - '0'
          - '1'

permissions:
  contents: write

concurrency:
  group: daily-vina-lottery-r2-generator
  cancel-in-progress: false

jobs:
  generator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve XOSO target date
        id: xoso_target
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Scheduled runs can start hours late. Subtract 6h so runs shortly
            # after midnight VN time still target the draw date that just closed.
            echo "date=$(TZ=Asia/Ho_Chi_Minh date -d '6 hours ago' +%F)" >> "$GITHUB_OUTPUT"
          else
            echo "date=${{ inputs.xoso_target_date }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved XOSO_TARGET_DATE=$(cat "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2)"

      - name: Pull Data & Generate R2 Static Stats
        env:
          WAIT_FOR_NEW_XOSO: ${{ github.event_name == 'workflow_dispatch' && inputs.wait_for_new_xoso || '1' }}
          XOSO_MAX_WAIT_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.xoso_max_wait_minutes || '90' }}
          XOSO_RETRY_INTERVAL_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.xoso_retry_interval_seconds || '60' }}
          XOSO_TARGET_DATE: ${{ steps.xoso_target.outputs.date }}
          LOTTERY_DATA_SOURCE: 'r2'
          LOTTERY_STATS_SOURCE: 'local'
          FORCE_REGENERATE_STATS: ${{ github.event_name == 'workflow_dispatch' && inputs.force_regenerate_stats || vars.FORCE_REGENERATE_STATS || '0' }}
          CLOUDFLARE_R2_CLEAR_STATS_PREFIX: ${{ github.event_name == 'workflow_dispatch' && inputs.clear_r2_statistics || '0' }}
          SYNC_R2_AFTER_UPDATE: '1'
          SYNC_SUPABASE_AFTER_UPDATE: '0'
          SIMULATION_CACHE_DAYS: '90'
          SIMULATION_CACHE_PLAY_MODES: 'both'
          BACKTEST_CLEAR_HISTORY_CACHE_INTERVAL: '30'
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL }}
        run: node scripts/update-static-data.js

      - name: Audit thống kê Local/R2
        env:
          AUDIT_LOCAL: '0'
          NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL }}
        run: npm run stats:audit

      - name: Kiểm tra dữ liệu có thay đổi không
        id: changes
        env:
          COMMIT_STATIC_DATA: ${{ vars.COMMIT_STATIC_DATA || '0' }}
        run: |
          if [ "$COMMIT_STATIC_DATA" != "1" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Đã upload R2; bỏ qua commit static JSON vì COMMIT_STATIC_DATA != 1."
            exit 0
          fi
          if git diff --quiet -- lib/data/xsmb-2-digits.json lib/data/statistics; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Không có dữ liệu mới, bỏ qua build/commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Có dữ liệu mới, sẽ build kiểm tra trước khi commit."
          fi

      - name: Build kiểm tra trước khi deploy
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Tự động commit và đẩy dữ liệu mới
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/data/xsmb-2-digits.json lib/data/statistics/*.json
          git commit -m "Auto-update: Kết quả xổ số & Thống kê Tĩnh (Bot)"
          git push

      - name: Kích hoạt Vercel Deploy Hook dự phòng
        if: steps.changes.outputs.changed == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          else
            echo "Không cấu hình VERCEL_DEPLOY_HOOK_URL; Vercel sẽ deploy qua Git integration khi workflow push commit."
          fi

      # In R2 mode (COMMIT_STATIC_DATA=0), stats go directly to R2 without git commits.
      # We must still redeploy Vercel to kill warm serverless instances that cache old data in memory.
      - name: Force Vercel Redeploy (R2 mode)
        if: steps.changes.outputs.changed != 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "R2 mode: Triggering Vercel redeploy to clear warm function caches..."
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
            echo ""
            echo "✅ Vercel redeploy triggered."
          else
            echo "⚠️ VERCEL_DEPLOY_HOOK_URL not configured. Warm serverless functions may serve stale data for up to 10 minutes."
          fi
