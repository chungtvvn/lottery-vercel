name: Daily Vina Lottery R2 Generator

on:
  schedule:
    # Cloudflare Worker dispatches the primary run at 18:40 GMT+7 (11:40 UTC).
    # Keep one GitHub-native backup slot only; update-static-data is idempotent
    # and exits without redeploy when R2 already has full data/cache for the day.
    - cron: '5 12 * * *'
  workflow_dispatch:
    inputs:
      wait_for_new_xoso:
        description: '1 = chờ dữ liệu ngày mới, 0 = chỉ test luồng bằng dữ liệu mới nhất đang có'
        required: true
        default: '0'
        type: choice
        options:
          - '1'
          - '0'
      xoso_max_wait_minutes:
        description: 'Số phút chờ tối đa khi wait_for_new_xoso=1'
        required: true
        default: '90'
        type: string
      xoso_retry_interval_seconds:
        description: 'Khoảng cách retry nguồn xoso.com.vn'
        required: true
        default: '60'
        type: string
      xoso_target_date:
        description: 'Ngày cần chờ dạng YYYY-MM-DD; để trống sẽ dùng ngày hiện tại GMT+7'
        required: false
        default: ''
        type: string
      force_regenerate_stats:
        description: '1 = xoá cache cũ và sinh lại toàn bộ thống kê từ raw data hiện tại'
        required: true
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
      generate_profit_report_cache:
        description: '1 = chạy backtest dài để sinh báo cáo Đề/Lô từ đầu năm lên R2'
        required: true
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
      clear_r2_statistics:
        description: '1 = xoá toàn bộ object cũ trong R2 statistics/ trước khi upload'
        required: true
        default: '0'
        type: choice
        options:
          - '0'
          - '1'

permissions:
  contents: write

concurrency:
  group: daily-vina-lottery-r2-generator
  cancel-in-progress: false

jobs:
  generator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Bước xác minh cuối mới quyết định workflow thành công; runner core bị
    # thu hồi sẽ được job Lô phía sau tiếp tục từ trạng thái R2 hiện có.
    continue-on-error: true
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve XOSO target date
        id: xoso_target
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Scheduled runs can start hours late. Subtract 6h so runs shortly
            # after midnight VN time still target the draw date that just closed.
            echo "date=$(TZ=Asia/Ho_Chi_Minh date -d '6 hours ago' +%F)" >> "$GITHUB_OUTPUT"
          else
            echo "date=${{ inputs.xoso_target_date }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved XOSO_TARGET_DATE=$(cat "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2)"

      - name: Pull Data & Generate R2 Static Stats
        id: update
        env:
          WAIT_FOR_NEW_XOSO: ${{ github.event_name == 'workflow_dispatch' && inputs.wait_for_new_xoso || '1' }}
          XOSO_MAX_WAIT_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.xoso_max_wait_minutes || '90' }}
          XOSO_RETRY_INTERVAL_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.xoso_retry_interval_seconds || '60' }}
          XOSO_TARGET_DATE: ${{ steps.xoso_target.outputs.date }}
          LOTTERY_DATA_SOURCE: 'r2'
          LOTTERY_STATS_SOURCE: 'local'
          FORCE_REGENERATE_STATS: ${{ github.event_name == 'workflow_dispatch' && inputs.force_regenerate_stats || vars.FORCE_REGENERATE_STATS || '0' }}
          GENERATE_PROFIT_REPORT_CACHE: ${{ github.event_name == 'workflow_dispatch' && inputs.generate_profit_report_cache || '0' }}
          CLOUDFLARE_R2_CLEAR_STATS_PREFIX: ${{ github.event_name == 'workflow_dispatch' && inputs.clear_r2_statistics || '0' }}
          SYNC_R2_AFTER_UPDATE: '1'
          SYNC_SUPABASE_AFTER_UPDATE: '0'
          # Daily chỉ kết toán snapshot hôm nay + sinh dự đoán ngày mai.
          # Backtest 90 ngày là tác vụ nghiên cứu thủ công, không được chặn raw/Đề/Lô.
          SIMULATION_CACHE_DAYS: '0'
          SIMULATION_CACHE_PLAY_MODES: 'both'
          PREDICTION_HISTORY_INCREMENTAL: '1'
          # Lô chạy ở job riêng để runner bị thu hồi không làm mất kết quả Đề.
          LOTO_GENERATE_CACHE: '0'
          # Mốc 20 năm cũng chạy ở job riêng. Không để phép tính nặng này giữ
          # runner của raw/stats và làm mất toàn bộ kết quả cập nhật ngày.
          MILESTONE20Y_GENERATE_CACHE: '0'
          LOTO_SKIP_BACKTEST: '1'
          LOTO_POSITION_CONCURRENCY: '1'
          LOTO_CHILD_NODE_OPTIONS: '--max-old-space-size=4096'
          LOTO_PREDICTION_TIMEOUT_MS: '3600000'
          BACKTEST_CLEAR_HISTORY_CACHE_INTERVAL: '30'
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL }}
        run: node scripts/update-static-data.js

      - name: Đọc kết quả cập nhật
        id: update_result
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          let result = {};
          try {
            result = JSON.parse(fs.readFileSync('.update-static-data-result.json', 'utf8'));
          } catch (error) {
            result = { didWork: true, skipped: false, reason: 'missing-status-file' };
          }
          const bool = value => value ? 'true' : 'false';
          console.log(`did_work=${bool(result.didWork)}`);
          console.log(`skipped=${bool(result.skipped)}`);
          console.log(`r2_uploaded=${bool(result.r2Uploaded)}`);
          console.log(`prediction_cache_refreshed=${bool(result.predictionCacheRefreshed)}`);
          console.log(`stats_regenerated=${bool(result.statsRegenerated)}`);
          console.log(`raw_data_changed=${bool(result.rawDataChanged)}`);
          console.log(`latest_raw_date=${result.latestRawDate || ''}`);
          console.log(`reason=${result.reason || ''}`);
          NODE

      - name: Audit thống kê Local/R2
        if: steps.update_result.outputs.did_work == 'true'
        env:
          AUDIT_LOCAL: '0'
          NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL }}
        run: npm run stats:audit

      - name: Kiểm tra dữ liệu có thay đổi không
        id: changes
        env:
          COMMIT_STATIC_DATA: ${{ vars.COMMIT_STATIC_DATA || '0' }}
        run: |
          if [ "${{ steps.update_result.outputs.did_work }}" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "redeploy=false" >> "$GITHUB_OUTPUT"
            echo "Dữ liệu/cache đã đầy đủ (reason=${{ steps.update_result.outputs.reason }}); bỏ qua build/commit/redeploy."
            exit 0
          fi
          if [ "$COMMIT_STATIC_DATA" != "1" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "redeploy=true" >> "$GITHUB_OUTPUT"
            echo "Đã upload R2; bỏ qua commit static JSON vì COMMIT_STATIC_DATA != 1."
            exit 0
          fi
          if git diff --quiet -- lib/data/xsmb-2-digits.json lib/data/statistics; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "redeploy=${{ steps.update_result.outputs.r2_uploaded }}" >> "$GITHUB_OUTPUT"
            echo "Không có dữ liệu mới, bỏ qua build/commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "redeploy=false" >> "$GITHUB_OUTPUT"
            echo "Có dữ liệu mới, sẽ build kiểm tra trước khi commit."
          fi

      - name: Build kiểm tra trước khi deploy
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Tự động commit và đẩy dữ liệu mới
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/data/xsmb-2-digits.json lib/data/statistics/*.json
          git commit -m "Auto-update: Kết quả xổ số & Thống kê Tĩnh (Bot)"
          git push

      - name: Kích hoạt Vercel Deploy Hook dự phòng
        if: steps.changes.outputs.changed == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          else
            echo "Không cấu hình VERCEL_DEPLOY_HOOK_URL; Vercel sẽ deploy qua Git integration khi workflow push commit."
          fi

  milestone20y_primary:
    name: Mốc 20 năm prediction cache
    needs: generator
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 55
    continue-on-error: true
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate and upload Mốc 20 năm cache
        env:
          DAILY_MILESTONE20Y_ONLY: '1'
          LOTTERY_DATA_SOURCE: 'r2'
          LOTTERY_STATS_SOURCE: 'local'
          SYNC_R2_AFTER_UPDATE: '1'
          SYNC_SUPABASE_AFTER_UPDATE: '0'
          MILESTONE20Y_GENERATE_CACHE: '1'
          # Chỉ job độc lập này được phép chờ lâu. Baseline năm được tải từ
          # R2 nên thông thường chỉ còn tính snapshot ngày mới và kết toán.
          MILESTONE20Y_PREDICTION_TIMEOUT_MS: '2700000'
          LOTO_GENERATE_CACHE: '0'
          SIMULATION_CACHE_DAYS: '0'
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL }}
        run: node scripts/update-static-data.js

  loto_primary:
    name: Lô prediction cache
    needs: generator
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 55
    continue-on-error: true
    outputs:
      cache_ready: ${{ steps.verify.outputs.cache_ready }}
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      LOTO_METHOD_ID: rrfParallelBlock85Small65
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve Lô target date
        id: target
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TARGET_DATE="$(TZ=Asia/Ho_Chi_Minh date -d '6 hours ago' +%F)"
          elif [ -n "${{ inputs.xoso_target_date }}" ]; then
            TARGET_DATE="${{ inputs.xoso_target_date }}"
          else
            TARGET_DATE="$(TZ=Asia/Ho_Chi_Minh date +%F)"
          fi
          echo "date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "Resolved Lô target date: $TARGET_DATE"

      - name: Generate and upload Lô cache
        env:
          DAILY_LOTO_ONLY: '1'
          LOTTERY_DATA_SOURCE: 'r2'
          LOTTERY_STATS_SOURCE: 'local'
          SYNC_R2_AFTER_UPDATE: '1'
          SYNC_SUPABASE_AFTER_UPDATE: '0'
          LOTO_GENERATE_CACHE: '1'
          LOTO_SKIP_BACKTEST: '1'
          SIMULATION_CACHE_DAYS: '0'
          LOTO_POSITION_CONCURRENCY: '1'
          LOTO_CHILD_NODE_OPTIONS: '--max-old-space-size=4096'
          LOTO_PREDICTION_TIMEOUT_MS: '3000000'
          MILESTONE20Y_GENERATE_CACHE: '0'
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL }}
        run: node scripts/update-static-data.js

      - name: Verify Lô cache on R2
        id: verify
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
          LOTO_METHOD_ID: ${{ env.LOTO_METHOD_ID }}
          NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL }}
        run: |
          node - <<'NODE'
          const zlib = require('zlib');
          const base = String(process.env.NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL || '').replace(/\/$/, '');
          const target = process.env.TARGET_DATE;
          async function read(path) {
            const response = await fetch(`${base}/${path}.gz`, { cache: 'no-store' });
            if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
            return JSON.parse(zlib.gunzipSync(Buffer.from(await response.arrayBuffer())));
          }
          (async () => {
            const [raw, cache, live] = await Promise.all([
              read('data/xsmb-2-digits.json'),
              read('statistics/cached_loto_prediction.json'),
              read('statistics/cached_loto_live_predictions.json')
            ]);
            const latestRaw = raw.at(-1)?.date;
            if (!latestRaw) throw new Error('Không đọc được latestRaw từ R2 raw data.');
            if (cache.latestDataDate !== latestRaw || live.latestDataDate !== latestRaw) {
              throw new Error(`Lô cache stale: cache=${cache.latestDataDate}, live=${live.latestDataDate}, latestRaw=${latestRaw}, target=${target}`);
            }
            const expectedMethod = process.env.LOTO_METHOD_ID;
            if (cache.config?.methodId !== expectedMethod) {
              throw new Error(`Lô method sai: ${cache.config?.methodId || 'missing'}, expected=${expectedMethod}`);
            }
            if (Number(cache.config?.stakePerNumberK) !== 2200 || Number(cache.config?.payoutPerHitK) !== 8000) {
              throw new Error(`Lô công thức sai: stake=${cache.config?.stakePerNumberK || 'missing'}, payout=${cache.config?.payoutPerHitK || 'missing'}`);
            }
            const strategy = cache.config?.strategy || expectedMethod;
            const predictions = cache.nextPrediction?.predictions || cache.nextPrediction?.strategies?.[strategy]?.predictions;
            const defaultLen = predictions?.top6?.numbers?.length;
            const top7Len = predictions?.top7?.numbers?.length;
            if (Number(cache.config?.defaultBetCount) !== 6 || defaultLen !== 6 || top7Len !== 7) {
              throw new Error(`Lô default sai: defaultBetCount=${cache.config?.defaultBetCount || 'missing'}, length=${defaultLen || 'missing'}`);
            }
            const edge75Pit = cache.nextPrediction?.strategies?.dedupEdge75Pit?.predictions;
            if (edge75Pit?.top6?.numbers?.length !== 6 || edge75Pit?.top7?.numbers?.length !== 7) {
              throw new Error(`Lô Edge75 PIT thiếu: top6=${edge75Pit?.top6?.numbers?.length || 0}, top7=${edge75Pit?.top7?.numbers?.length || 0}`);
            }
            console.log(`cache_ready=true`);
            require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'cache_ready=true\n');
            console.log(`✅ Lô R2 đã đủ raw ${latestRaw}; target ${target}; dự đoán ${cache.nextPrediction?.predictionIsoDate || 'unknown'}.`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

  verify_and_redeploy:
    name: Verify Đề + Lô and redeploy
    needs: [generator, milestone20y_primary, loto_primary]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LOTO_METHOD_ID: rrfParallelBlock85Small65
    steps:
      - name: Resolve expected date
        id: target
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TARGET_DATE="$(TZ=Asia/Ho_Chi_Minh date -d '6 hours ago' +%F)"
          elif [ -n "${{ inputs.xoso_target_date }}" ]; then
            TARGET_DATE="${{ inputs.xoso_target_date }}"
          else
            TARGET_DATE="$(TZ=Asia/Ho_Chi_Minh date +%F)"
          fi
          echo "date=$TARGET_DATE" >> "$GITHUB_OUTPUT"

      - name: Verify raw, Đề and Lô caches
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
          LOTO_METHOD_ID: ${{ env.LOTO_METHOD_ID }}
          NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL }}
        run: |
          node - <<'NODE'
          const zlib = require('zlib');
          const base = String(process.env.NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL || '').replace(/\/$/, '');
          const target = process.env.TARGET_DATE;
          async function readGzip(path) {
            const response = await fetch(`${base}/${path}.gz`, { cache: 'no-store' });
            if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
            return JSON.parse(zlib.gunzipSync(Buffer.from(await response.arrayBuffer())));
          }
          (async () => {
            const [raw, milestone, history, loto, lotoLive] = await Promise.all([
              readGzip('data/xsmb-2-digits.json'),
              readGzip('statistics/cached_milestone20y_prediction.json'),
              readGzip('statistics/cached_prediction_history.json'),
              readGzip('statistics/cached_loto_prediction.json'),
              readGzip('statistics/cached_loto_live_predictions.json')
            ]);
            const latestRaw = raw.at(-1)?.date;
            const dates = {
              raw: latestRaw,
              de: milestone.latestDataDate,
              loto: loto.latestDataDate,
              lotoLive: lotoLive.latestDataDate
            };
            if (!latestRaw) throw new Error('Không đọc được latestRaw từ R2 raw data.');
            const nextDate = new Date(`${latestRaw}T00:00:00Z`);
            nextDate.setUTCDate(nextDate.getUTCDate() + 1);
            const expectedPredictionDate = nextDate.toISOString().slice(0, 10);
            const historyRun = history.find(item => String(item?.predictionDate || '').slice(0, 10) === expectedPredictionDate);
            const historyMethod = historyRun?.summary?.methods?.deParallelBlock85Small65Hold70;
            const historyBets = historyMethod?.numbersToBet || [];
            const historyIntersections = historyMethod?.intersectionNumbers || [];
            if (
              historyRun?.sourceDrawDate !== latestRaw ||
              historyRun?.summary?.resolved === true ||
              historyMethod?.methodVersion !== '2026-07-15-parallel-shared-ranking-v3' ||
              historyBets.length < 35 || historyBets.length > 50 ||
              Number(historyMethod?.unitCount) !== historyBets.length + historyIntersections.length ||
              Number(historyMethod?.unitCount) !== 50
            ) {
              throw new Error(`R2 Lịch sử pending sai: prediction=${historyRun?.predictionDate || 'missing'}, source=${historyRun?.sourceDrawDate || 'missing'}, version=${historyMethod?.methodVersion || 'missing'}, bets=${historyBets.length}, units=${historyMethod?.unitCount || 'missing'}`);
            }
            const stale = Object.entries(dates).filter(([, date]) => date !== latestRaw);
            if (stale.length) {
              throw new Error(`R2 chưa đồng bộ latestRaw=${latestRaw}, target=${target}: ${JSON.stringify(dates)}`);
            }
            if (Number(loto.config?.stakePerNumberK) !== 2200 || Number(loto.config?.payoutPerHitK) !== 8000) {
              throw new Error(`R2 Lô công thức sai: stake=${loto.config?.stakePerNumberK || 'missing'}, payout=${loto.config?.payoutPerHitK || 'missing'}`);
            }
            const expectedMethod = process.env.LOTO_METHOD_ID;
            if (loto.config?.methodId !== expectedMethod) {
              throw new Error(`R2 Lô method sai: ${loto.config?.methodId || 'missing'}, expected=${expectedMethod}`);
            }
            const strategy = loto.config?.strategy || expectedMethod;
            const predictions = loto.nextPrediction?.predictions || loto.nextPrediction?.strategies?.[strategy]?.predictions;
            const defaultLen = predictions?.top6?.numbers?.length;
            const top7Len = predictions?.top7?.numbers?.length;
            if (Number(loto.config?.defaultBetCount) !== 6 || defaultLen !== 6 || top7Len !== 7) {
              throw new Error(`R2 Lô default sai: defaultBetCount=${loto.config?.defaultBetCount || 'missing'}, length=${defaultLen || 'missing'}`);
            }
            const edge75Pit = loto.nextPrediction?.strategies?.dedupEdge75Pit?.predictions;
            if (edge75Pit?.top6?.numbers?.length !== 6 || edge75Pit?.top7?.numbers?.length !== 7) {
              throw new Error(`R2 Lô Edge75 PIT thiếu: top6=${edge75Pit?.top6?.numbers?.length || 0}, top7=${edge75Pit?.top7?.numbers?.length || 0}`);
            }
            console.log(`✅ Đề + Lô đồng bộ raw ${latestRaw}; target ${target}. Dự đoán Lô: ${loto.nextPrediction?.predictionIsoDate || 'unknown'}.`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Send Telegram daily report
        env:
          TELEGRAM_WORKER_NOTIFY_URL: ${{ secrets.TELEGRAM_WORKER_NOTIFY_URL }}
          TELEGRAM_DISPATCH_SECRET: ${{ secrets.TELEGRAM_DISPATCH_SECRET }}
        run: |
          if [ -z "$TELEGRAM_WORKER_NOTIFY_URL" ] || [ -z "$TELEGRAM_DISPATCH_SECRET" ]; then
            echo "Telegram Worker secrets chưa cấu hình; cron Cloudflare sẽ thử gửi nếu KV đã sẵn sàng."
            exit 0
          fi
          curl -fsS -X POST "$TELEGRAM_WORKER_NOTIFY_URL/telegram/notify" \
            -H "x-dispatch-secret: $TELEGRAM_DISPATCH_SECRET"

      - name: Force Vercel redeploy after both caches are ready
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
            echo ""
            echo "✅ Vercel redeploy triggered after Đề + Lô verification."
          else
            echo "⚠️ VERCEL_DEPLOY_HOOK_URL not configured."
          fi
