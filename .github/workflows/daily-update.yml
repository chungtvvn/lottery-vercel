name: Daily Vina Lottery R2 Generator

on:
  schedule:
    # Cloudflare Worker dispatches the primary run at 18:40 GMT+7 (11:40 UTC).
    # Keep one GitHub-native backup slot only; update-static-data is idempotent
    # and exits without redeploy when R2 already has full data/cache for the day.
    - cron: '5 12 * * *'
  workflow_dispatch:
    inputs:
      wait_for_new_xoso:
        description: '1 = chờ dữ liệu ngày mới, 0 = chỉ test luồng bằng dữ liệu mới nhất đang có'
        required: true
        default: '0'
        type: choice
        options:
          - '1'
          - '0'
      xoso_max_wait_minutes:
        description: 'Số phút chờ tối đa khi wait_for_new_xoso=1'
        required: true
        default: '90'
        type: string
      xoso_retry_interval_seconds:
        description: 'Khoảng cách retry nguồn xoso.com.vn'
        required: true
        default: '60'
        type: string
      xoso_target_date:
        description: 'Ngày cần chờ dạng YYYY-MM-DD; để trống sẽ dùng ngày hiện tại GMT+7'
        required: false
        default: ''
        type: string
      force_regenerate_stats:
        description: '1 = xoá cache cũ và sinh lại toàn bộ thống kê từ raw data hiện tại'
        required: true
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
      clear_r2_statistics:
        description: '1 = xoá toàn bộ object cũ trong R2 statistics/ trước khi upload'
        required: true
        default: '0'
        type: choice
        options:
          - '0'
          - '1'

permissions:
  contents: write

concurrency:
  group: daily-vina-lottery-r2-generator
  cancel-in-progress: false

jobs:
  generator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Bước xác minh cuối mới quyết định workflow thành công; runner core bị
    # thu hồi sẽ được job Lô phía sau tiếp tục từ trạng thái R2 hiện có.
    continue-on-error: true
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve XOSO target date
        id: xoso_target
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Scheduled runs can start hours late. Subtract 6h so runs shortly
            # after midnight VN time still target the draw date that just closed.
            echo "date=$(TZ=Asia/Ho_Chi_Minh date -d '6 hours ago' +%F)" >> "$GITHUB_OUTPUT"
          else
            echo "date=${{ inputs.xoso_target_date }}" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved XOSO_TARGET_DATE=$(cat "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2)"

      - name: Pull Data & Generate R2 Static Stats
        id: update
        env:
          WAIT_FOR_NEW_XOSO: ${{ github.event_name == 'workflow_dispatch' && inputs.wait_for_new_xoso || '1' }}
          XOSO_MAX_WAIT_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.xoso_max_wait_minutes || '90' }}
          XOSO_RETRY_INTERVAL_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.xoso_retry_interval_seconds || '60' }}
          XOSO_TARGET_DATE: ${{ steps.xoso_target.outputs.date }}
          LOTTERY_DATA_SOURCE: 'r2'
          LOTTERY_STATS_SOURCE: 'local'
          FORCE_REGENERATE_STATS: ${{ github.event_name == 'workflow_dispatch' && inputs.force_regenerate_stats || vars.FORCE_REGENERATE_STATS || '0' }}
          CLOUDFLARE_R2_CLEAR_STATS_PREFIX: ${{ github.event_name == 'workflow_dispatch' && inputs.clear_r2_statistics || '0' }}
          SYNC_R2_AFTER_UPDATE: '1'
          SYNC_SUPABASE_AFTER_UPDATE: '0'
          SIMULATION_CACHE_DAYS: '90'
          SIMULATION_CACHE_PLAY_MODES: 'both'
          # Lô chạy ở job riêng để runner bị thu hồi không làm mất kết quả Đề.
          LOTO_GENERATE_CACHE: '0'
          LOTO_SKIP_BACKTEST: '1'
          LOTO_POSITION_CONCURRENCY: '1'
          LOTO_CHILD_NODE_OPTIONS: '--max-old-space-size=4096'
          LOTO_PREDICTION_TIMEOUT_MS: '1800000'
          BACKTEST_CLEAR_HISTORY_CACHE_INTERVAL: '30'
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL }}
        run: node scripts/update-static-data.js

      - name: Đọc kết quả cập nhật
        id: update_result
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          let result = {};
          try {
            result = JSON.parse(fs.readFileSync('.update-static-data-result.json', 'utf8'));
          } catch (error) {
            result = { didWork: true, skipped: false, reason: 'missing-status-file' };
          }
          const bool = value => value ? 'true' : 'false';
          console.log(`did_work=${bool(result.didWork)}`);
          console.log(`skipped=${bool(result.skipped)}`);
          console.log(`r2_uploaded=${bool(result.r2Uploaded)}`);
          console.log(`prediction_cache_refreshed=${bool(result.predictionCacheRefreshed)}`);
          console.log(`stats_regenerated=${bool(result.statsRegenerated)}`);
          console.log(`raw_data_changed=${bool(result.rawDataChanged)}`);
          console.log(`latest_raw_date=${result.latestRawDate || ''}`);
          console.log(`reason=${result.reason || ''}`);
          NODE

      - name: Audit thống kê Local/R2
        if: steps.update_result.outputs.did_work == 'true'
        env:
          AUDIT_LOCAL: '0'
          NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL }}
        run: npm run stats:audit

      - name: Kiểm tra dữ liệu có thay đổi không
        id: changes
        env:
          COMMIT_STATIC_DATA: ${{ vars.COMMIT_STATIC_DATA || '0' }}
        run: |
          if [ "${{ steps.update_result.outputs.did_work }}" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "redeploy=false" >> "$GITHUB_OUTPUT"
            echo "Dữ liệu/cache đã đầy đủ (reason=${{ steps.update_result.outputs.reason }}); bỏ qua build/commit/redeploy."
            exit 0
          fi
          if [ "$COMMIT_STATIC_DATA" != "1" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "redeploy=true" >> "$GITHUB_OUTPUT"
            echo "Đã upload R2; bỏ qua commit static JSON vì COMMIT_STATIC_DATA != 1."
            exit 0
          fi
          if git diff --quiet -- lib/data/xsmb-2-digits.json lib/data/statistics; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "redeploy=${{ steps.update_result.outputs.r2_uploaded }}" >> "$GITHUB_OUTPUT"
            echo "Không có dữ liệu mới, bỏ qua build/commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "redeploy=false" >> "$GITHUB_OUTPUT"
            echo "Có dữ liệu mới, sẽ build kiểm tra trước khi commit."
          fi

      - name: Build kiểm tra trước khi deploy
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Tự động commit và đẩy dữ liệu mới
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/data/xsmb-2-digits.json lib/data/statistics/*.json
          git commit -m "Auto-update: Kết quả xổ số & Thống kê Tĩnh (Bot)"
          git push

      - name: Kích hoạt Vercel Deploy Hook dự phòng
        if: steps.changes.outputs.changed == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          else
            echo "Không cấu hình VERCEL_DEPLOY_HOOK_URL; Vercel sẽ deploy qua Git integration khi workflow push commit."
          fi

  loto_primary:
    name: Lô prediction cache
    needs: generator
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    outputs:
      cache_ready: ${{ steps.verify.outputs.cache_ready }}
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve Lô target date
        id: target
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TARGET_DATE="$(TZ=Asia/Ho_Chi_Minh date -d '6 hours ago' +%F)"
          elif [ -n "${{ inputs.xoso_target_date }}" ]; then
            TARGET_DATE="${{ inputs.xoso_target_date }}"
          else
            TARGET_DATE="$(TZ=Asia/Ho_Chi_Minh date +%F)"
          fi
          echo "date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "Resolved Lô target date: $TARGET_DATE"

      - name: Generate and upload Lô cache
        env:
          WAIT_FOR_NEW_XOSO: '0'
          XOSO_TARGET_DATE: ${{ steps.target.outputs.date }}
          LOTTERY_DATA_SOURCE: 'r2'
          LOTTERY_STATS_SOURCE: 'local'
          FORCE_REGENERATE_STATS: '0'
          SYNC_R2_AFTER_UPDATE: '1'
          SYNC_SUPABASE_AFTER_UPDATE: '0'
          LOTO_GENERATE_CACHE: '1'
          LOTO_SKIP_BACKTEST: '1'
          LOTO_POSITION_CONCURRENCY: '1'
          LOTO_CHILD_NODE_OPTIONS: '--max-old-space-size=4096'
          LOTO_PREDICTION_TIMEOUT_MS: '1800000'
          MILESTONE20Y_GENERATE_CACHE: '0'
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL }}
        run: node scripts/update-static-data.js

      - name: Verify Lô cache on R2
        id: verify
        env:
          EXPECTED_DATE: ${{ steps.target.outputs.date }}
          NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL }}
        run: |
          node - <<'NODE'
          const zlib = require('zlib');
          const base = String(process.env.NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL || '').replace(/\/$/, '');
          const expected = process.env.EXPECTED_DATE;
          async function read(file) {
            const response = await fetch(`${base}/statistics/${file}.gz`, { cache: 'no-store' });
            if (!response.ok) throw new Error(`${file}: HTTP ${response.status}`);
            return JSON.parse(zlib.gunzipSync(Buffer.from(await response.arrayBuffer())));
          }
          (async () => {
            const [cache, live] = await Promise.all([
              read('cached_loto_prediction.json'),
              read('cached_loto_live_predictions.json')
            ]);
            if (cache.latestDataDate !== expected || live.latestDataDate !== expected) {
              throw new Error(`Lô cache stale: cache=${cache.latestDataDate}, live=${live.latestDataDate}, expected=${expected}`);
            }
            if (cache.config?.methodId !== 'milestone20yChainSmallFirstHold65TwoHitGreedy') {
              throw new Error(`Lô method sai: ${cache.config?.methodId || 'missing'}`);
            }
            console.log(`cache_ready=true`);
            require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'cache_ready=true\n');
            console.log(`✅ Lô R2 đã đủ cho ${expected}, dự đoán ${cache.nextPrediction?.predictionIsoDate || 'unknown'}.`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

  loto_retry:
    name: Lô prediction cache retry
    needs: [generator, loto_primary]
    if: always() && needs.loto_primary.outputs.cache_ready != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      cache_ready: ${{ steps.verify.outputs.cache_ready }}
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve Lô target date
        id: target
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TARGET_DATE="$(TZ=Asia/Ho_Chi_Minh date -d '6 hours ago' +%F)"
          elif [ -n "${{ inputs.xoso_target_date }}" ]; then
            TARGET_DATE="${{ inputs.xoso_target_date }}"
          else
            TARGET_DATE="$(TZ=Asia/Ho_Chi_Minh date +%F)"
          fi
          echo "date=$TARGET_DATE" >> "$GITHUB_OUTPUT"

      - name: Retry generate and upload Lô cache
        env:
          WAIT_FOR_NEW_XOSO: '0'
          XOSO_TARGET_DATE: ${{ steps.target.outputs.date }}
          LOTTERY_DATA_SOURCE: 'r2'
          LOTTERY_STATS_SOURCE: 'local'
          FORCE_REGENERATE_STATS: '0'
          SYNC_R2_AFTER_UPDATE: '1'
          SYNC_SUPABASE_AFTER_UPDATE: '0'
          LOTO_GENERATE_CACHE: '1'
          LOTO_SKIP_BACKTEST: '1'
          LOTO_POSITION_CONCURRENCY: '1'
          LOTO_CHILD_NODE_OPTIONS: '--max-old-space-size=4096'
          LOTO_PREDICTION_TIMEOUT_MS: '1800000'
          MILESTONE20Y_GENERATE_CACHE: '0'
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL }}
        run: node scripts/update-static-data.js

      - name: Verify retried Lô cache on R2
        id: verify
        env:
          EXPECTED_DATE: ${{ steps.target.outputs.date }}
          NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL }}
        run: |
          node - <<'NODE'
          const zlib = require('zlib');
          const base = String(process.env.NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL || '').replace(/\/$/, '');
          const expected = process.env.EXPECTED_DATE;
          async function read(file) {
            const response = await fetch(`${base}/statistics/${file}.gz`, { cache: 'no-store' });
            if (!response.ok) throw new Error(`${file}: HTTP ${response.status}`);
            return JSON.parse(zlib.gunzipSync(Buffer.from(await response.arrayBuffer())));
          }
          (async () => {
            const [cache, live] = await Promise.all([
              read('cached_loto_prediction.json'),
              read('cached_loto_live_predictions.json')
            ]);
            if (cache.latestDataDate !== expected || live.latestDataDate !== expected) {
              throw new Error(`Lô cache stale sau retry: cache=${cache.latestDataDate}, live=${live.latestDataDate}, expected=${expected}`);
            }
            require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'cache_ready=true\n');
            console.log(`✅ Retry Lô R2 thành công cho ${expected}.`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

  verify_and_redeploy:
    name: Verify Đề + Lô and redeploy
    needs: [generator, loto_primary, loto_retry]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve expected date
        id: target
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TARGET_DATE="$(TZ=Asia/Ho_Chi_Minh date -d '6 hours ago' +%F)"
          elif [ -n "${{ inputs.xoso_target_date }}" ]; then
            TARGET_DATE="${{ inputs.xoso_target_date }}"
          else
            TARGET_DATE="$(TZ=Asia/Ho_Chi_Minh date +%F)"
          fi
          echo "date=$TARGET_DATE" >> "$GITHUB_OUTPUT"

      - name: Verify raw, Đề and Lô caches
        env:
          EXPECTED_DATE: ${{ steps.target.outputs.date }}
          NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL }}
        run: |
          node - <<'NODE'
          const zlib = require('zlib');
          const base = String(process.env.NEXT_PUBLIC_CLOUDFLARE_R2_PUBLIC_URL || '').replace(/\/$/, '');
          const expected = process.env.EXPECTED_DATE;
          async function readGzip(path) {
            const response = await fetch(`${base}/${path}.gz`, { cache: 'no-store' });
            if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
            return JSON.parse(zlib.gunzipSync(Buffer.from(await response.arrayBuffer())));
          }
          (async () => {
            const [raw, milestone, loto, lotoLive] = await Promise.all([
              readGzip('data/xsmb-2-digits.json'),
              readGzip('statistics/cached_milestone20y_prediction.json'),
              readGzip('statistics/cached_loto_prediction.json'),
              readGzip('statistics/cached_loto_live_predictions.json')
            ]);
            const latestRaw = raw.at(-1)?.date;
            const dates = {
              raw: latestRaw,
              de: milestone.latestDataDate,
              loto: loto.latestDataDate,
              lotoLive: lotoLive.latestDataDate
            };
            const stale = Object.entries(dates).filter(([, date]) => date !== expected);
            if (stale.length) {
              throw new Error(`R2 chưa đồng bộ ${expected}: ${JSON.stringify(dates)}`);
            }
            console.log(`✅ Đề + Lô đồng bộ ${expected}. Dự đoán Lô: ${loto.nextPrediction?.predictionIsoDate || 'unknown'}.`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Force Vercel redeploy after both caches are ready
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
            echo ""
            echo "✅ Vercel redeploy triggered after Đề + Lô verification."
          else
            echo "⚠️ VERCEL_DEPLOY_HOOK_URL not configured."
          fi
