name: Daily Vina Lottery Supabase Generator

on:
  schedule:
    # Chạy hàng ngày lúc 18:40 GMT+7 (Hà Nội) = 11:40 UTC.
    - cron: '40 11 * * *'
  workflow_dispatch:
    inputs:
      wait_for_new_xoso:
        description: '1 = chờ dữ liệu ngày mới, 0 = chỉ test luồng bằng dữ liệu mới nhất đang có'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '0'
      xoso_max_wait_minutes:
        description: 'Số phút chờ tối đa khi wait_for_new_xoso=1'
        required: true
        default: '90'
        type: string
      xoso_retry_interval_seconds:
        description: 'Khoảng cách retry nguồn xoso.com.vn'
        required: true
        default: '60'
        type: string
      xoso_target_date:
        description: 'Ngày cần chờ dạng YYYY-MM-DD; để trống sẽ dùng ngày hiện tại GMT+7'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  generator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Kiểm tra kết nối Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STATS_BUCKET: ${{ vars.SUPABASE_STATS_BUCKET || 'lottery-stats' }}
        run: npm run supabase:check

      - name: Pull Data & Generate Supabase Stats
        env:
          WAIT_FOR_NEW_XOSO: ${{ github.event_name == 'workflow_dispatch' && inputs.wait_for_new_xoso || '1' }}
          XOSO_MAX_WAIT_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.xoso_max_wait_minutes || '90' }}
          XOSO_RETRY_INTERVAL_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.xoso_retry_interval_seconds || '60' }}
          XOSO_TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.xoso_target_date || '' }}
          LOTTERY_STATS_SOURCE: 'supabase-db'
          SYNC_SUPABASE_AFTER_UPDATE: '1'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STATS_BUCKET: ${{ vars.SUPABASE_STATS_BUCKET || 'lottery-stats' }}
        run: node scripts/update-static-data.js

      - name: Kiểm tra dữ liệu có thay đổi không
        id: changes
        env:
          COMMIT_STATIC_DATA: ${{ vars.COMMIT_STATIC_DATA || '0' }}
        run: |
          if [ "$COMMIT_STATIC_DATA" != "1" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Đã sync Supabase; bỏ qua commit static JSON vì COMMIT_STATIC_DATA != 1."
            exit 0
          fi
          if git diff --quiet -- lib/data/xsmb-2-digits.json lib/data/statistics; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Không có dữ liệu mới, bỏ qua build/commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Có dữ liệu mới, sẽ build kiểm tra trước khi commit."
          fi

      - name: Build kiểm tra trước khi deploy
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Tự động commit và đẩy dữ liệu mới
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/data/xsmb-2-digits.json lib/data/statistics/*.json
          git commit -m "Auto-update: Kết quả xổ số & Thống kê Tĩnh (Bot)"
          git push

      - name: Kích hoạt Vercel Deploy Hook dự phòng
        if: steps.changes.outputs.changed == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          else
            echo "Không cấu hình VERCEL_DEPLOY_HOOK_URL; Vercel sẽ deploy qua Git integration khi workflow push commit."
          fi
