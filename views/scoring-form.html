<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính Điểm XSMB | Lottery Stats</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .hidden {
            display: none;
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.05);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #4f46e5;
            animation: spin 1s ease infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .details-row>td {
            padding: 0 !important;
            border: 0 !important;
        }
    </style>
</head>

<body class="antialiased text-slate-800">
    <!-- Header / Navigation -->
    <header class="nav-glass-blur sticky top-0 z-50 mb-8 w-full">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            <div class="flex h-16 items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                        <i class="bi bi-graph-up text-white text-lg"></i>
                    </div>
                    <a href="/" class="text-xl font-bold tracking-tight text-slate-900 hover:opacity-90 transition">XSMB <span class="bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent font-extrabold">Stats</span></a>
                </div>
                <nav class="hidden md:flex space-x-1">
                    <a href="/statistics" class="nav-link-custom px-3 py-2 text-sm font-medium whitespace-nowrap">Thống kê</a>
                    <a href="/records" class="nav-link-custom px-3 py-2 text-sm font-medium whitespace-nowrap">Kỷ lục</a>
                    <a href="/chain-frequency" class="nav-link-custom px-3 py-2 text-sm font-medium whitespace-nowrap">Chọn chuỗi loại</a>
                    <a href="/simulation" class="nav-link-custom px-3 py-2 text-sm font-medium whitespace-nowrap">Lịch sử</a>
                    <a href="/scoring" class="nav-link-custom px-3 py-2 text-sm font-semibold whitespace-nowrap active">Tính điểm</a>
                    <a href="/settings" class="nav-link-custom px-3 py-2 text-sm font-medium whitespace-nowrap">⚙️</a>
                </nav>
                <!-- Mobile Navigation Bar -->
                <div class="flex md:hidden">
                    <nav class="flex space-x-1 overflow-x-auto max-w-[280px] sm:max-w-[400px] py-1 custom-scrollbar">
                        <a href="/statistics" class="nav-link-custom px-2.5 py-1.5 text-xs font-medium whitespace-nowrap">Thống kê</a>
                        <a href="/records" class="nav-link-custom px-2.5 py-1.5 text-xs font-medium whitespace-nowrap">Kỷ lục</a>
                        <a href="/chain-frequency" class="nav-link-custom px-2.5 py-1.5 text-xs font-medium whitespace-nowrap">Chuỗi loại</a>
                        <a href="/simulation" class="nav-link-custom px-2.5 py-1.5 text-xs font-medium whitespace-nowrap">Lịch sử</a>
                        <a href="/scoring" class="nav-link-custom px-2.5 py-1.5 text-xs font-semibold whitespace-nowrap active">Tính điểm</a>
                        <a href="/settings" class="nav-link-custom px-2.5 py-1.5 text-xs font-medium whitespace-nowrap">⚙️</a>
                    </nav>
                </div>
            </div>
        </div>
    </header>

    <div class="container mx-auto max-w-7xl px-4 pb-12">
        <div id="customSearchSection" class="glass-card p-6 mb-12">
            <h2 class="text-2xl font-bold text-slate-900 mb-6 border-b border-slate-100 pb-4">Tìm kiếm Tùy chỉnh</h2>
            <form id="scoringForm">
                <input type="hidden" name="mode" value="de">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <fieldset>
                        <legend class="block text-sm font-medium text-slate-500">Loại tìm kiếm</legend>
                        <div class="mt-4 flex gap-x-8">
                            <div class="flex items-center">
                                <input id="searchTypeOccurrence" name="searchType" type="radio" value="occurrence" checked class="h-4 w-4 border-slate-300 text-indigo-600 focus:ring-indigo-500 bg-white">
                                <label for="searchTypeOccurrence" class="ml-3 block text-sm font-medium text-slate-700">Theo số lần về</label>
                            </div>
                            <div class="flex items-center">
                                <input id="searchTypeForms" name="searchType" type="radio" value="forms" class="h-4 w-4 border-slate-300 text-indigo-600 focus:ring-indigo-500 bg-white">
                                <label for="searchTypeForms" class="ml-3 block text-sm font-medium text-slate-700">Theo dạng số</label>
                            </div>
                        </div>
                    </fieldset>
                    <div>
                        <label for="startDate" class="block text-sm font-medium text-slate-500">Từ ngày</label>
                        <input type="date" id="startDate" name="startDate" class="glass-input mt-1 block w-full text-sm">
                    </div>
                    <div>
                        <label for="endDate" class="block text-sm font-medium text-slate-500">Đến ngày</label>
                        <input type="date" id="endDate" name="endDate" class="glass-input mt-1 block w-full text-sm">
                    </div>
                </div>
                <div id="occurrenceInput" class="mt-4">
                    <label for="occurrenceCount" class="block text-sm font-medium text-slate-500">Nhập số lần về</label>
                    <input type="number" name="occurrenceCount" id="occurrenceCount" class="glass-input mt-1 block w-full md:w-1/3 text-sm" placeholder="Ví dụ: 0">
                </div>

                <div id="formsSelection" class="mt-4 hidden">
                    <div class="flex justify-between items-center mb-2">
                        <h4 class="text-sm font-medium text-slate-700">Chọn các dạng số</h4>
                        <div class="flex gap-2">
                            <button type="button" id="selectAllForms" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-1.5 px-3 rounded-lg border border-slate-200 transition">Chọn tất cả</button>
                            <button type="button" id="clearAllForms" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-1.5 px-3 rounded-lg border border-slate-200 transition">Bỏ chọn</button>
                        </div>
                    </div>
                    <div id="checkboxGrid" class="grid grid-cols-2 md:grid-cols-4 gap-4 p-4 border border-slate-200 rounded-xl max-h-60 overflow-y-auto bg-slate-50/50 custom-scrollbar"></div>
                </div>

                <div class="mt-6">
                    <button type="submit" id="searchButton" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold py-2.5 px-4 rounded-xl shadow hover:shadow-indigo-500/10 transition duration-150 flex items-center justify-center gap-2">
                        <span id="searchButtonText">Tìm kiếm</span>
                        <div id="searchSpinner" class="spinner hidden" style="width: 20px; height: 20px; border-width: 2px;"></div>
                    </button>
                </div>
            </form>
        </div>

        <div id="customSearchResultsContainer" class="mt-10"></div>

        <hr class="my-12 border-t border-slate-200">

        <div id="aggregateResultsContainer" class="mt-10">
            <div class="text-center py-8">
                <div class="spinner mx-auto mb-4"></div>
                <p class="text-slate-500">Đang tải dữ liệu tổng hợp...</p>
            </div>
        </div>
    </div>

    <script>
        // Fetch scoring data from API instead of EJS server-side injection
        let serverData = { results: [], scoringForms: [] };
        fetch('/api/scoring/aggregate')
            .then(r => r.json())
            .then(data => {
                serverData = data;
                if (window._initScoringPage) window._initScoringPage(data);
            })
            .catch(err => {
                console.error('Error loading scoring data:', err);
                document.getElementById('aggregateResultsContainer').innerHTML =
                    '<div class="bg-red-50 border border-red-500/10 text-red-650 p-4 rounded-xl"><p>Lỗi tải dữ liệu: ' + err.message + '</p></div>';
            });
    </script>
    <script src="/js/scoring-client.js"></script>
</body>

</html>
